<!DOCTYPE html>
<html>
    <head>
        <title>zyX Library Tests - Conditional</title>
        <link rel="stylesheet" href="./css/styles.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div class="container">
            <a class="back-button" id="back-button" href="./index.html">Go Back</a>
            <script src="./js/js.js"></script>
            <h1 class="page-title">zyX Library Tests - Conditional</h1>
            <div class="description">Conditional rendering and logic handling</div>

            <div id="app"></div>

            <h1>This file's code:</h1>
            <div id="code-example"></div>
        </div>
        <style>
            /* Condition Demo Styles */
            .condition-demo {
                background: var(--bg-card);
                padding: var(--space-xl);
                border-radius: var(--space-lg);
                margin: var(--space-xl) 0;
                border: 1px solid var(--border-color);
            }

            .value-display {
                font-size: 1.5rem;
                color: var(--primary);
                margin: var(--space-lg) 0;
                text-align: center;
                font-weight: 500;
            }

            /* Condition Blocks */
            .condition-block {
                padding: var(--space-lg);
                border-radius: var(--space-md);
                margin: var(--space-sm) 0;
                border: 1px solid var(--color);
                color: var(--color);
                background: var(--bg-card);
                transition: var(--transition-normal);
                position: relative;
                overflow: hidden;
            }

            .condition-block::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(45deg, transparent, color-mix(in srgb, var(--color) 10%, transparent));
                opacity: 0;
                transition: var(--transition-normal);
            }

            .condition-block:hover::before {
                opacity: 1;
            }

            .condition-blocks {
                display: grid;
                gap: var(--space-md);
                margin: var(--space-xl) 0;
            }

            .list-controls {
                display: flex;
                flex-wrap: wrap;
                gap: var(--space-sm);
                margin: var(--space-md) 0;
            }

            .list-controls button {
                flex: 1 1 180px;
            }

            .playlist-list {
                margin: var(--space-md) 0 0;
                padding-left: var(--space-lg);
            }
        </style>

        <script type="module" id="main_script">
            import { html, LiveVar, LiveList } from "../../";

            import { CodePreview } from "./js/codePreview.js";

            const codePreview = new CodePreview();
            codePreview.appendTo(document.getElementById("code-example"));

            await codePreview.updateCode(document.getElementById("main_script"));

            class ConditionalDemo {
                constructor() {
                    // Create a dynamic value for testing conditions
                    this.count = new LiveVar(5);

                    this.count2 = new LiveVar(0);

                    this.showQueue = new LiveVar(true);
                    this.learningQueue = new LiveList([{ title: "Session 1" }]);
                    this.trackId = 1;

                    html`
                        <div class="condition-demo">
                            <h1>zyX Conditional Rendering Test</h1>

                            <div class="value-display">Current value: ${this.count.interp()}</div>
                            <div>
                                <button zyx-click="${() => this.count.set(Math.max(this.count.value - 1, 0))}">
                                    Decrement
                                </button>
                                <button zyx-click="${() => this.count.set(this.count.value + 1)}">Increment</button>
                                <button zyx-click="${() => this.count.set(3)}">Reset to 3</button>
                            </div>

                            <div class="value-display">Current value2: ${this.count2.interp()}</div>
                            <div>
                                <button zyx-click="${() => this.count2.set(Math.max(this.count2.value - 1, 0))}">
                                    Decrement
                                </button>
                                <button zyx-click="${() => this.count2.set(this.count2.value + 1)}">Increment</button>
                                <button zyx-click="${() => this.count2.set(0)}">Reset to 0</button>
                            </div>

                            <h2>Conditional Blocks:</h2>
                            <div zyx-if=${[this.count, (v) => v > 3]} class="condition-block" style="--color: #4caf50;">
                                This block is shown when value is greater than 3 (current: ${this.count.interp()})
                            </div>
                            <div
                                zyx-elif=${[this.count, (v) => v == 3]}
                                class="condition-block"
                                style="--color: #66d9ef;"
                            >
                                This block is shown when value is equal to 3 (current: ${this.count.interp()})
                            </div>
                            <div zyx-else class="condition-block" style="--color: #f1c40f;">
                                This block is shown when value is less than 3 (current: ${this.count.interp()})
                            </div>
                            <div
                                zyx-if=${[this.count, (v) => v % 2 === 0]}
                                class="condition-block"
                                style="--color: #cc99cd;"
                            >
                                This value is even: ${this.count.interp()}
                            </div>
                            <div zyx-else class="condition-block" style="--color: #ff9966;">
                                This value is odd: ${this.count.interp()}
                            </div>
                            <h2>Inline or on individual blocks:</h2>
                            <div
                                id="inline_or_example"
                                zyx-if=${[this.count, this.count2, (v, v2) => v === 5 && v2 === 0]}
                                class="condition-block"
                                style="--color: #9b59b6;"
                            >
                                This block is shown when value is 0 and value2 is 5, or when the main condition is false
                                but the inline or (value is 0 and value2 is 5) is true. Current count:
                                ${this.count.interp()} Count2: ${this.count2.interp()}
                            </div>

                            <h2>LiveList queue condition:</h2>
                            <p>
                                Toggle visibility and mutate a <code>LiveList</code> to see a multi-input conditional in
                                action.
                            </p>
                            <div class="list-controls">
                                <button
                                    zyx-click="${() => {
                                        this.trackId += 1;
                                        this.learningQueue.push({ title: `Session ${this.trackId}` });
                                    }}"
                                >
                                    Add session
                                </button>
                                <button zyx-click="${() => this.learningQueue.pop()}">Remove last</button>
                                <button zyx-click="${() => this.learningQueue.clear()}">Clear all</button>
                                <button zyx-click="${() => this.showQueue.set(!this.showQueue.value)}">
                                    ${this.showQueue.interp((flag) => (flag ? "Hide queue" : "Show queue"))}
                                </button>
                            </div>
                            <div class="value-display">
                                Sessions queued: ${this.learningQueue.interp((list) => list.length)}
                            </div>
                            <div
                                class="condition-block"
                                style="--color: #1abc9c;"
                                zyx-if=${[this.showQueue, this.learningQueue, (show, list) => show && list.length > 0]}
                            >
                                <p>Queue is visible with ${this.learningQueue.interp((list) => list.length)}</p>
                            </div>
                            <div zyx-else class="condition-block" style="--color: #e74c3c;">
                                <p>The queue is hidden or empty.</p>
                            </div>
                        </div>
                    `
                        .bind(this)
                        .place(document.getElementById("app"));
                }
            }

            const demo = new ConditionalDemo();
            document.body.classList.add("loaded");
        </script>
    </body>
</html>
